name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          # Name the file after the version, so every download saves under a new name.
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "VoiceLists-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceLists-${{ env.VERSION }}
          path: VoiceLists-${{ env.VERSION }}.apk
      - name: Publish as a release for this version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Voice Lists ${{ env.VERSION }}
          files: VoiceLists-${{ env.VERSION }}.apk
          make_latest: true
